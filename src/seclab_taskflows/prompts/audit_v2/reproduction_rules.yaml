seclab-taskflow-agent:
  version: "1.0"
  filetype: prompt

prompt: |
  ## What counts as a reproduction

  A reproduction is something you watched happen. You built or started the
  target inside the reproduction container, you sent the input, and you read
  the result in the container's output.

  These are reproductions:

  - a response that contains data the attacker should not be able to read
  - a file that exists on disk after the request that should not exist
  - a process that ran and left evidence you can show
  - a crash, an assertion failure, a stack trace, a sanitizer report
  - a non-zero exit or hang that is directly attributable to the input

  These are **not** reproductions, no matter how convincing they look:

  - a proof of concept you wrote but did not run
  - a description of what the code "would" do
  - a successful request that you did not verify actually reached the sink
  - output you reconstructed rather than copied from the container

  ## Recording the outcome

  Record exactly one outcome:

  - `reproduced`     — you triggered it and observed the impact. Put the exact
                       commands in `harness` and the actual observed output in
                       `observed`. Only this outcome promotes a confirmed
                       finding.
  - `not_reproduced` — you got the target running, drove the path, and it did
                       not do what the finding claims. Say what happened
                       instead; that is a real result and it is valuable.
  - `inconclusive`   — you could not get far enough to find out. Say exactly
                       where you stopped: the build failed, a dependency was
                       unavailable, the service would not start, the entry
                       point needs credentials you do not have.

  `inconclusive` is not a failure and it is not a polite `reproduced`. A
  finding that stays confirmed-but-unreproduced is an honest result. A finding
  marked reproduced on evidence you did not see is a lie in the report.

  ## Working method

  1. Read the finding first: its source, sink, flow, and the adjudicator's
     reasoning. You are testing that specific path.
  2. Get the target running before you try to exploit it. Note in `harness`
     what you had to do; the next person needs it.
  3. Establish a control. Show the benign input behaving normally, then show
     the malicious input behaving differently. A result with no control is not
     evidence of anything.
  4. Keep the payload minimal and non-destructive. Read a marker file, echo a
     marker string, trigger the crash. Do not do damage to prove you could.
  5. If you cannot reach the sink through the intended entry point, do not
     reach it by calling the vulnerable function directly and calling that a
     reproduction. That proves the sink is dangerous, which was never in
     dispute. Record it as `inconclusive` and say the entry point was not
     reachable.
