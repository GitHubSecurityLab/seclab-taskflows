seclab-taskflow-agent:
  filetype: toolbox
  version: "1.0"

server_params:
  kind: stdio
  command: python
  args: ["-m", "seclab_taskflows.mcp_servers.container_shell"]
  env:
    CONTAINER_IMAGE: "ghcr.io/githubsecuritylab/seclab-shell-source-access:latest"
    CONTAINER_WORKSPACE: "{{ env('CONTAINER_WORKSPACE', required=False) or env('DATA_DIR') ~ '/repo_under_test' }}"
    CONTAINER_TIMEOUT: "{{ env('CONTAINER_TIMEOUT', '60') }}"
    CONTAINER_PERSIST: "{{ env('CONTAINER_PERSIST', 'true') }}"
    CONTAINER_PERSIST_KEY: "{{ env('CONTAINER_PERSIST_KEY', required=False) }}"
    CONTAINER_NETWORK: "none"
    LOG_DIR: "{{ env('LOG_DIR') }}"

server_prompt: |
  ## Container Shell (Source Access)
  You have access to an isolated Docker container for source access and code exploration.
  The configured source directory is mounted at /workspace. All tools run inside
  the container, and the container is persistent across MCP server restarts by default.

  Available tools:
  - tgrep         - Trigram-indexed regex search: `tgrep -n --index-path /tmp/tgrep-index '<pattern>' /workspace`
  - fd            — Fast file finder: `fd -e py /workspace`
  - tree          — Directory structure: `tree /workspace`
  - ctags         — Multi-language tag/symbol index (`ctags -R .`)
  - global (gtags/global) — Source code cross-reference: `gtags` to index, `global -r <sym>` to find callers
  - cscope        — C/C++ cross-reference browser (`cscope -R -b` to build, `cscope -R -L -2 <sym>` for callers)
  - git           — Version control and source history inspection
  - grep, sed, awk, find — Standard code exploration

  tgrep usage (https://github.com/microsoft/tgrep):
  - Before the first search in each session, run
    `tgrep index /workspace --index-path /tmp/tgrep-index` and wait for it to succeed.
    Use container_shell_exec with timeout=300 for indexing; allow longer for large repositories.
    Plain searches do not automatically build an index: without one they scan every file.
  - Keep the index in /tmp/tgrep-index, outside the mounted source tree. Pass
    `--index-path /tmp/tgrep-index` on every indexed search so tgrep finds it.
    The index survives MCP server restarts while the container persists.
  - No server is required. Re-run the index command after files change or a different
    revision is checked out; an on-disk index is a snapshot and can miss new matches.
  - Use `-n` for line numbers, `-i` for case-insensitive matching, `-F` for literal text,
    `-g '*.py'` to filter paths, `-C 3` for context, and `-l` for matching filenames.
    Add `--stats` to inspect the query plan and index candidate counts.
  - Hidden, ignored, binary, and files larger than 64 MiB are skipped by default.
    Use `--hidden` or `--no-ignore` when needed (these bypass the index).
    Use `tgrep --no-index --no-max-filesize -n '<pattern>' /workspace` to search current
    files without an index or size cap; normal hidden/ignore/binary rules still apply.
  - Exit codes: 0 means matches, 1 means no matches, and 2 means an error.

  Typical source access workflow:
  1. `tree /workspace | head -80` — inspect the repository layout
  2. `fd . /workspace | head -100` — list files quickly
  3. `tgrep index /workspace --index-path /tmp/tgrep-index` - build the search index
  4. `tgrep -n --index-path /tmp/tgrep-index '<pattern>' /workspace` - search source text
  5. `cd /workspace && ctags -R --fields=+ne .` - build a symbol index
  6. `cd /workspace && gtags --compact && global -x <symbol>` - cross-reference symbols